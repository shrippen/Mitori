name: Android APK

# A debug APK of every push to main, as a workflow artifact for testing on a device.
# Publishes nothing; release APKs come from release.yml.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'third_party/mitori-daten/**'
      - 'scripts/build-android.sh'
      - 'scripts/build-kf6-android.sh'
      - '.github/actions/android-setup/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# A newer push to main replaces the older APK build instead of queueing behind it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # GitHub only: Gitea Actions would also read .github/workflows.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The mitori-daten submodule at third_party/mitori-daten/: actions/checkout
      # cannot pull from git.arianw.de on GitHub's runner (no Gitea credentials).
      - name: Clone mitori-daten submodule
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git submodule sync --recursive
          git config --global url."https://oauth2:${GITEA_TOKEN}@git.arianw.de/".insteadOf "https://git.arianw.de/"
          git submodule update --init --force --depth=1 --recursive
          git config --local --unset url."https://oauth2:${GITEA_TOKEN}@git.arianw.de/".insteadOf 2>/dev/null || true

      - uses: ./.github/actions/android-setup

      # Qt and KF6 change only with their versions in the scripts.
      - name: Cache Qt and KF6
        uses: actions/cache@v4
        with:
          path: |
            ~/Qt
            ~/kf6-android
          key: android-${{ hashFiles('scripts/build-android.sh', 'scripts/build-kf6-android.sh') }}

      - name: Build APK
        env:
          MITORI_VERBOSE: 1
        run: ./scripts/build-android.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mitori-debug
          path: dist/android/mitori-debug.apk
          if-no-files-found: error
          retention-days: 7
